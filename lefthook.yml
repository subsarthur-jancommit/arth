# Lefthook configuration for git hooks
# Cross-platform compatible (Windows, macOS, Linux)
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    # Format then lint, sequentially inside ONE command, so the two binaries
    # never write the same file concurrently. --no-error-on-unmatched-pattern
    # is required: oxlint exits 1 on a docs- or CSS-only commit, where none of
    # the staged files are JS/TS for it to lint.
    # --type-aware is deliberately absent; it runs in `bun run check` and CI so
    # that commits stay fast.
    # --max-warnings=0 removed in the fork (docs/FORK.md). package.json's lint
    # scripts lost it in the first batch; this hook kept its own copy, so every
    # `warn` rule was still a commit blocker. warn now means warn everywhere.
    oxc:
      glob: '*.{js,mjs,cjs,ts,tsx,jsx,css,json,jsonc,md,yml,yaml,toml}'
      run: bun oxfmt --no-error-on-unmatched-pattern {staged_files} && bun oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.{ts,tsx}'
      # TS7 native (single `typescript@^7` package; Next 16.3 shells out to
      # the TS CLI itself, so no classic JS-API copy is needed). The global
      # Sanity TypeGen query registry can change without invalidating TS7's
      # incremental cache; a warm cache then turns every query result into
      # unknown. A full pass costs local speed, but it prevents commits that
      # only pass because they read a stale registry.
      run: bun node_modules/typescript/bin/tsc --noEmit --incremental false
      stage_fixed: false

# Build stays CI-only (too slow for a local pre-push gate). The unit suite is
# cheap enough to run here, so a push can't land with it broken. The manifest
# check that used to share this job left in the fork (docs/FORK.md, step 1):
# COMPONENTS.md is a report now, regenerated when wanted.
pre-push:
  commands:
    unit-tests:
      run: bun test
      skip:
        - merge
        - rebase

# Branch switches leave the previous branch's generated route types in
# .next/types (tsconfig includes them), producing ghost tsc errors about
# routes that don't exist on the new branch. Clear them on real branch
# checkouts only — {3} is git's flag: 1 = branch switch, 0 = file checkout.
# They regenerate on the next `bun dev` / `bun run build`.
post-checkout:
  commands:
    clear-generated-types:
      skip:
        - rebase
      run: '[ "{3}" != "1" ] || rm -rf .next/types .next/dev/types'

post-merge:
  commands:
    install-deps:
      run: bun i
