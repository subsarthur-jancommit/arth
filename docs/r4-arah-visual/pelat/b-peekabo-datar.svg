<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120" role="img" aria-labelledby="t d">
<title id="t">Arah B, Maket cahaya: pelat Peekabo, versi datar tanpa WebGL</title>
<desc id="d">Papan kampanye pembukaan kafe. Kolom: sebelum kafe dibuka, hari pertama dibuka, dan sesudahnya. Baris: perhatian, kepercayaan, dan penjualan. Kartu berisi sasaran dan pesan, satu hari syuting untuk stok konten sebulan, iklan di TikTok, Meta, dan Google, warga sekitar diundang lebih dulu, booth dan sampling, temu pelanggan, serta kreator, host live, dan sales yang ikut menjual. Gambar diam R4, karya asli untuk Arthur; lihat docs/r4-arah-visual/README.md.</desc>
