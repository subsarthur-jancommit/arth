>minggu tanpa Anda memikirkan apa</tspan><tspan x="898" dy="17.68">yang diunggah.</tspan></text><rect x="880" y="424" width="315" height="126" fill="#f4f3ef" fill-opacity="0.05" stroke="#f4f3ef" stroke-width="1.2" stroke-opacity="0.8"/><text x="898" y="454" font-family="'Archivo', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#f4f3ef" style="font-stretch:118%">Pendampingan ads bulanan</text><text x="898" y="479" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" fill="#f4f3ef" fill-opacity="0.75"><tspan x="898" dy="0">Tim Anda tetap memegang akun,</tspan><tspan x="898" dy="17.68">sementara kami mengarahkan dan</tspan><tspan x="898" dy="17.68">memeriksa hasilnya setiap bulan.</tspan></text><rect x="230" y="580" width="280" height="212" fill="#f4f3ef" fill-opacity="0.05" stroke="#f4f3ef" stroke-width="1.2" stroke-opacity="0.8"/><text x="248" y="610" font-family="'Archivo', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#f4f3ef" style="font-stretch:118%"><tspan x="248" dy="0">Warga sekitar diundang</tspan><tspan x="248" dy="20.74">lebih dulu</tspan></text><circle cx="350" cy="712" r="20" fill="none" stroke="#f4f3ef" stroke-width="1.1" stroke-opacity="1"/><circle cx="350" cy="712" r="34" fill="none" stroke="#f4f3ef" stroke-width="1.1" stroke-dasharray="4 4" stroke-opacity="0.7"/><circle cx="350" cy="712" r="48" fill="none" stroke="#f4f3ef" stroke-width="1.1" stroke-dasharray="4 4" stroke-opacity="0.7"/><rect x="335" y="706.5" width="30" height="11" fill="#f4f3ef" fill-opacity="0.9"/><text x="406" y="716" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11" fill="#f4f3ef">kafe</text><rect x="540" y="580" width="310" height="130" fill="#f4f3ef" fill-opacity="0.05" stroke="#f4f3ef" stroke-width="1.2" stroke-opacity="0.8"/><text x="558" y="610" font-family="'Archivo', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#f4f3ef" style="font-stretch:118%">Booth, sampling, demo</text><text x="558" y="635" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" fill="#f4f3ef" fill-opacity="0.75"><tspan x="558" dy="0">Produk dicoba langsung di tempat</tspan><tspan x="558" dy="17.68">orang sudah berkumpul.</tspan></text><rect x="880" y="580" width="315" height="130" fill="#f4f3ef" fill-opacity="0.05" stroke="#f4f3ef" stroke-width="1.2" stroke-opacity="0.8"/><text x="898" y="610" font-family="'Archivo', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#f4f3ef" style="font-stretch:118%">Temu pelanggan</text><text x="898" y="635" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" fill="#f4f3ef" fill-opacity="0.75"><tspan x="898" dy="0">Pelanggan bertemu langsung dan</tspan><tspan x="898" dy="17.68">merasa menjadi bagian dari brand.</tspan></text><rect x="230" y="820" width="280" height="126" fill="#f4f3ef" fill-opacity="0.05" stroke="#f4f3ef" stroke-width="1.2" stroke-opacity="0.8"/><text x="248" y="850" font-family="'Archivo', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#f4f3ef" style="font-stretch:118%"><tspan x="248" dy="0">Pasokan creator</tspan><tspan x="248" dy="20.74">dan influencer</tspan></text><text x="248" y="896" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" fill="#f4f3ef" fill-opacity="0.75"><tspan x="248" dy="0">Anda mendapat kreator yang</tspan><tspan x="248" dy="17.68">cocok dengan audiens Anda tanpa</tspan><tspan x="248" dy="17.68">mencari satu per satu.</tspan></text><rect x="540" y="820" width="655" height="126" fill="#f4f3ef" fill-opacity="0.05" stroke="#f4f3ef" stroke-width="1.2" stroke-opacity="0.8"/><text x="558" y="850" font-family="'Archivo', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#f4f3ef" style="font-stretch:118%">Kreator, host live, dan sales ikut menjual</text><text x="558" y="875" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" fill="#f4f3ef" fill-opacity="0.75">Mereka dibayar dari penjualan yang benar-benar terjadi.</text><rect x="80" y="966" width="1125" height="80" fill="#f4f3ef" fill-opacity="0.05" stroke="#f4f3ef" stroke-width="1.2" stroke-opacity="0.8"/><text x="104" y="1014" font-family="'Archivo', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#f4f3ef" style="font-stretch:118%">Target, lingkup, dan laporan disepakati tertulis.</text><text x="1181" y="1014" font-family="'Archivo', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#f4f3ef" text-anchor="end" style="font-stretch:118%">Kami tidak menjanjikan jangkauan atau penjualan.</text></g><text x="1240" y="128" font-family="'Archivo', 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="800" fill="#f4f3ef" letter-spacing="-1" style="font-stretch:125%">03 / 03</text><text x="1240" y="170" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#f4f3ef" fill-opacity="0.8" letter-spacing="2.4">PEEKABO</text><text x="1240" y="204" font-family="'Archivo', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#f4f3ef"><tspan x="1240" dy="0">Pembukaan cabang</tspan><tspan x="1240" dy="26.4">atau gerai</tspan></text><text x="1240" y="262.4" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="13" fill="#f4f3ef" fill-opacity="0.62">Papan kampanye pembukaan</text><text x="1240" y="294.6" font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="12" fill="#f4f3ef" fill-opacity="0.62"><tspan x="1240" dy="0">Rangkaian yang mungkin, bukan proyek yang</tspan><tspan x="1240" dy="17.4">pernah kami kerjakan.</tspan></text>
