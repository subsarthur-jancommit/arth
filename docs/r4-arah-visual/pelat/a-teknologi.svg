<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120" role="img" aria-labelledby="t d">
<title id="t">Arah A, Lembar kerja: pelat Teknologi</title>
<desc id="d">Diagram alur pesanan kafe dalam empat jalur: tamu, sistem, dapur, dan pemasok. Tamu memesan dan membayar dari meja atau lewat WhatsApp; pesanan dicatat dan uangnya dicocokkan; layar dapur menampilkan pesanan; stok bahan tercatat, dan bila bahan menipis, pesanan ulang ke pemasok terkirim sendiri. Gambar diam R4, karya asli untuk Arthur; lihat docs/r4-arah-visual/README.md.</desc>
