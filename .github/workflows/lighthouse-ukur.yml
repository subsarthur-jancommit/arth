name: Lighthouse ukur
permissions:
  contents: read

# F4-06 "Ukur di perangkat nyata", the lab half: Lighthouse against
# production, on every template the package names, with a phone profile and a
# desktop one. `.github/scripts/lighthouse-ukur.mjs` runs and summarises it;
# `docs/F4-06-UKUR.md` carries the results, how to read them, and the owner's
# half of the package, which is a real phone.
#
# ## By hand only
#
# `workflow_dispatch`: measuring production has nothing to do with a push, and
# four jobs of Lighthouse are not something every PR should pay for. Actions
# → Lighthouse ukur → Run workflow, on `main`. The summary is on the run page
# and in the `lighthouse-ringkasan` artifact; every report is in
# `lighthouse-<variant>`.
#
# The first two measurements ran from the PR that added this file, under a
# `pull_request` trigger limited to its two files (runs 42247088223 and
# 42249548838): GitHub dispatches a workflow only once it is on the default
# branch. That trigger was removed before merge.
#
# ## Lab, not field
#
# - No INP. Lighthouse's navigation mode sees no interaction, so it reports
#   TBT, which the doc uses as the lab proxy and names as such (CLAUDE.md #19).
# - `mobile` is Lighthouse's default: simulated throttling at 150 ms RTT,
#   1.6 Mbps and a 4x CPU slowdown, which Lighthouse calls slow 4G. A model of
#   a mid-range phone on a slow link, not a phone. `mobile-applied` imposes
#   the same profile on the browser instead of modelling it; the script says
#   why both are kept.
# - The runner is a shared VM in GitHub's network, not in Indonesia. Each
#   report's `benchmarkIndex` records how fast that machine was.
# - Every run is a first visit: Lighthouse resets storage, so the
#   once-per-session entrance curtain plays on every page it measures.
#
# ## A ref built on the runner: lab A/B, not production
#
# `ref` (optional) measures a commit before it reaches production. Each job
# checks that ref out, builds it with the three public Sanity values `ci.yml`
# already builds with, serves it with `next start` on the runner, and measures
# localhost with the same four variants and medians. Added for F4-06 perbaikan,
# whose fixes had to be measured before merge while PR previews answer 302 to
# Vercel's login. The owner's permission for this change, PROSEDUR §4.6, in
# their words: "Ya, izinkan ref".
#
# Such a run is a lab A/B: compare it with main built and measured the same
# way, never with a production run. No CDN, no Vercel edge, a runner's own
# server. Production is still re-measured after each merge, without `ref`.
# Runs on one branch share a concurrency group, so dispatch one ref at a time.
on:
  workflow_dispatch:
    inputs:
      site:
        description: Origin to measure
        default: https://arth-test-01.vercel.app
      runs:
        description: Runs per page and variant; the median is reported
        default: '3'
      ref:
        description: >-
          Optional. A commit or branch to build and serve on the runner and
          measure instead of `site` (lab A/B against main built the same way)
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LIGHTHOUSE_VERSION: 13.5.0
  # With `ref`, the origin is the runner's own `next start`.
  SITE: ${{ inputs.ref && 'http://localhost:3000' || inputs.site || 'https://arth-test-01.vercel.app' }}
  RUNS: ${{ inputs.runs || '3' }}
  REF: ${{ inputs.ref }}

jobs:
  measure:
    name: measure (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One variant failing says nothing about the others.
      fail-fast: false
      matrix:
        variant: [mobile, mobile-applied, desktop, desktop-webgl]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Pinned, so two runs a month apart measure the site and not two
      # versions of Lighthouse. The runner's own Chrome is used, and its
      # version is printed here and recorded in every report.
      - name: Install Lighthouse
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/lighthouse" "lighthouse@$LIGHTHOUSE_VERSION"
          echo "LIGHTHOUSE_BIN=$RUNNER_TEMP/lighthouse/node_modules/.bin/lighthouse" >> "$GITHUB_ENV"
          google-chrome --version

      # Only with `ref`: the commit to measure, built and served the way
      # `ci.yml` builds it and Playwright serves it. The measuring script
      # stays this branch's, checked out above.
      - name: Check out the ref to measure
        if: ${{ inputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: measured

      - uses: oven-sh/setup-bun@v2
        if: ${{ inputs.ref }}
        with:
          bun-version-file: measured/package.json

      - name: Build the ref
        if: ${{ inputs.ref }}
        working-directory: measured
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: az53j4l1
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: '2025-03-01'
        run: |
          git log -1 --format='Measuring %H %s'
          bun install --frozen-lockfile
          bun run build

      - name: Serve the ref
        if: ${{ inputs.ref }}
        working-directory: measured
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: az53j4l1
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: '2025-03-01'
        run: |
          nohup bun run start > "$RUNNER_TEMP/next-start.log" 2>&1 &
          for second in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:3000/id; then
              echo "next start answered after ${second}s"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/next-start.log"
          exit 1

      - name: Measure
        env:
          VARIANT: ${{ matrix.variant }}
        run: node .github/scripts/lighthouse-ukur.mjs measure "$VARIANT" lighthouse

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ matrix.variant }}
          path: lighthouse/
          if-no-files-found: warn
          retention-days: 30

  report:
    needs: measure
    # A variant that failed still leaves the others worth reading.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8
        with:
          pattern: lighthouse-*
          path: lighthouse
          merge-multiple: true

      - name: Summarise
        run: |
          node .github/scripts/lighthouse-ukur.mjs summarise lighthouse ringkasan.md ringkasan.json
          if [ -n "$REF" ]; then
            echo "**Lab A/B: \`$REF\` built and served on the runner, not production.**" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          cat ringkasan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the summary
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-ringkasan
          path: |
            ringkasan.md
            ringkasan.json
          retention-days: 90
